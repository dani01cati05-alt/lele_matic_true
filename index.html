<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>lele.matic</title>
    <meta name="description" content="lele.matic — Portfolio.">
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="stylesheet" href="saracinesca/saracinesca.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>
    <!-- Questo fa esattamente la stessa cosa del comando inject() di Vercel -->
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<!-- Saracinesca: schermata di caricamento iniziale (si apre come una serranda) -->
<div id="shutter-loader" aria-hidden="true">
    <img class="shutter-img" src="saracinesca/assets/saracinesca.png" alt="" />
</div>

<div id="datetime-header" class="datetime-header"></div>

<button id="toggle-colors" class="toggle-btn" aria-label="Inverti colori"></button>

<button id="toggle-info" class="info-btn" aria-label="Apri info">
    <img src="red_skull_1.png" class="info-btn-icon" alt="">
</button>

<div id="info-overlay" class="info-overlay" aria-hidden="true">
    <div class="info-overlay-inner">
        <h1 class="info-title">GENERAL INFO</h1>
        <p class="info-para">LELE.MATIC</p>
        <p class="info-para"><a href="https://www.instagram.com/lele.matic?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank">IG @lele.matic</a></p>
    </div>
</div>

<!-- BOTTONE COMMENTI: globo 3D rotante che porta alla pagina commenti. -->
<a href="commenti.html" class="comments-btn" aria-label="Lascia un commento">
    <model-viewer src="GLOBE-v1.glb" class="comments-btn-icon" auto-rotate rotation-per-second="30deg" interaction-prompt="none" disable-zoom></model-viewer>
</a>

<!-- BOTTONE MONITOR: modello 3D rotante che porta alla pagina monitor. -->
<a href="monitor.html" class="monitor-btn" aria-label="Apri monitor">
    <model-viewer src="monitor_unicorn-v1.glb" class="monitor-btn-icon" auto-rotate rotation-per-second="30deg" interaction-prompt="none" disable-zoom></model-viewer>
</a>

    <section class="viewport">
        <div class="wheel" id="wheel">
            <div class="center-display" id="center-display">
                <img id="active-bg-image" class="rotating-center-image" src="" alt="Progetto Attivo" style="display: none; opacity: 0;">
                
                <model-viewer 
                    id="active-bg-model" 
                    src="" 
                    auto-rotate 
                    interaction-prompt="none"
                    camera-controls 
                    disable-zoom 
                    style="display: none; opacity: 0;">
                </model-viewer>
            </div>

            <div class="wheel-item">
                <a href="crackhead.html" class="wheel-content">
                    <model-viewer src="11real_rotante-v3.glb" interaction-prompt="none"></model-viewer>
                    <h3>Crackhead Bridge</h3>
                </a>
            </div>

            <div class="wheel-item">
                <a href="war_pigs.html" class="wheel-content">
                    <model-viewer src="war_pigs_book-v3.glb" interaction-prompt="none"></model-viewer>
                    <h3>Army of the War Pigs</h3>
                </a>
            </div>

            <div class="wheel-item">
                <a href="flying_saucers.html" class="wheel-content">
                    <model-viewer src="BOOK_UFO-v4.glb" interaction-prompt="none"></model-viewer>
                    <h3>Flying Saucers</h3>
                </a>
            </div>

            <div class="wheel-item">
                <a href="winebox.html" class="wheel-content">
                    <model-viewer src="cartone-v2.glb" interaction-prompt="none"></model-viewer>
                    <h3>Wine Box</h3>
                </a>
            </div>

             <div class="wheel-item">
                <a href="ratz.html" class="wheel-content">
                    <model-viewer src="ratz_book-v2.glb" interaction-prompt="none"></model-viewer>
                    <h3>Rat Ratz</h3>
                </a>
            </div>
            
            <div class="wheel-item">
                <a href="tshirt.html" class="wheel-content">
                    <model-viewer src="tshirt.glb" interaction-prompt="none"></model-viewer>
                    <h3>Tshirt</h3>
                </a>
            </div>

        </div>
    </section>

    <div id="dynamic-title-container">
        <h3 id="dynamic-title"></h3>
    </div>

    <script src="saracinesca/saracinesca.js"></script>
    <script src="script.js"></script>
</body>
</html>
