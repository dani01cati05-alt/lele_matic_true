<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lele.matic · Configuratore Maglietta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#000;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .bg {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:#000;
  }

  .stage {
    position:fixed; inset:0; z-index:1;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------------- MAGLIETTA (immagine, grande, centrata) ---------------- */
  .shirt-wrap {
    position:relative; z-index:2;
    height:97vh; max-width:92vw;
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.25s ease-out;
  }
  .shirt-wrap img,
  .shirt-wrap svg { height:100%; width:auto; }

  /* ---------------- SLOT DEI DESIGN (sinistra / centro-sopra-maglietta / destra) ---------------- */
  .slots {
    position:fixed; top:38%; left:0; width:100%; z-index:3;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .slot-card {
    position:absolute; top:50%; left:50%;
    height:270px; width:auto;
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.75s cubic-bezier(.16,1,.3,1), opacity 0.6s ease;
  }
  .slot-card img {
    height:100%; width:auto; display:block;
  }

  #loading {
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    background:#000; color:#6c6c72; font-size:0.85rem; letter-spacing:0.08em;
    text-transform:uppercase;
    transition:opacity 0.4s ease;
  }
</style>
</head>
<body>

<div class="bg"></div>
<div id="loading">Caricamento…</div>

<div class="stage">
  <div class="shirt-wrap" id="shirtWrap">
    <img src="white_tee.png" alt="Maglietta" id="shirtImg">
  </div>
</div>

<div class="slots" id="slots"></div>

<script>
/* =========================================================================
   MAGLIETTA E DESIGN
   Per aggiungere altri design in futuro, basta aggiungere una riga qui sotto:
   { name: "Nome design", image: "nomefile.png" }
   (il file va messo nella stessa cartella di questa pagina)
   ========================================================================= */
const DESIGNS = [
  { name: "Orso",              image: "tee_bear.png" },
  { name: "Teschio",           image: "tee_skull.png" },
  { name: "Swans",             image: "tee_swans.png" },
  { name: "Tartaruga",         image: "tee_turtle.png" },
  { name: "Dawg",              image: "tee_dawg.png" },
  { name: "Muscle",            image: "tee_muscle.png" },
  { name: "Maschera",          image: "tee_mask.png" },
  { name: "Snitch",            image: "tee_snitch.png" },
  { name: "EU",                image: "tee_EU.png" },
  { name: "AK",                image: "tee_AK.png" },
  { name: "Gun Free",          image: "tee_gun_free.png" },
  { name: "Motion",            image: "tee_motion.png" },
  { name: "Hate",              image: "tee_hate.png" },
  { name: "Maschera Bianca",   image: "tee_maskW.png" },
];

/* =========================================================================
   PULIZIA OMBRA MAGLIETTA
   Il file white_tee.png ha un'ombra morbida "cotta" nel PNG (pixel semi-
   trasparenti grigi/scuri intorno al tessuto). La rimuoviamo a runtime via
   canvas: i pixel non completamente opachi e abbastanza scuri vengono resi
   trasparenti, lasciando intatto il tessuto bianco pieno.
   ========================================================================= */
function stripShadow(imgEl) {
  try {
    const c = document.createElement("canvas");
    c.width = imgEl.naturalWidth;
    c.height = imgEl.naturalHeight;
    const ctx = c.getContext("2d");
    ctx.drawImage(imgEl, 0, 0);
    const frame = ctx.getImageData(0, 0, c.width, c.height);
    const px = frame.data;
    for (let i = 0; i < px.length; i += 4) {
      const a = px[i + 3];
      if (a === 0) continue;
      const lightness = (px[i] + px[i + 1] + px[i + 2]) / 3;
      if (a < 250 && lightness < 235) px[i + 3] = 0;
    }
    ctx.putImageData(frame, 0, 0);
    imgEl.src = c.toDataURL();
  } catch (err) {
    // Alcuni browser bloccano la lettura dei pixel per immagini aperte da
    // file locale (file://): in quel caso teniamo semplicemente l'immagine
    // originale, senza bloccare il resto della pagina.
    console.warn("Pulizia ombra maglietta non disponibile:", err);
  }
}
const shirtImg = document.getElementById("shirtImg");
if (shirtImg.complete) stripShadow(shirtImg);
else shirtImg.addEventListener("load", () => stripShadow(shirtImg), { once: true });

/* =========================================================================
   MECCANISMO A SCATTI (come le lancette di un orologio)
   Solo 3 slot visibili: sinistra / centro (sopra la maglietta) / destra, con
   due posizioni extra oltre i bordi reali dello schermo per l'ingresso/uscita:
   quando un design esce a destra scompare oltre il bordo destro, e rientra
   da oltre il bordo sinistro. Ogni scroll fa avanzare o retrocedere di UNA
   sola posizione: il design si blocca sempre esattamente al centro, sopra
   la maglietta — nessuno scrubbing libero da gestire.
   ========================================================================= */
const N = DESIGNS.length;
let currentIndex = 0;
let isAnimating = false;
const ANIM_MS = 750; // deve combaciare con la transition CSS di .slot-card

// offset orizzontale (px), scala e opacità per ciascuna posizione relativa al centro.
// le posizioni -2/2 vengono ricalcolate dinamicamente ben oltre il bordo reale
// dello schermo (vedi computeSlots) e sono trasparenti: il design sfuma prima
// di raggiungere quel punto, così non si vede mai "attraversare" lo schermo
// o ricomparire dall'altra parte.
const SLOTS = {
  "-2": { x: -1200, scale: 0.55, opacity: 0 },
  "-1": { x: -560,  scale: 0.78, opacity: 1 },
  "0":  { x: 0,      scale: 1.35, opacity: 1 },
  "1":  { x: 560,    scale: 0.78, opacity: 1 },
  "2":  { x: 1200,   scale: 0.55, opacity: 0 },
};

function computeSlots() {
  const edge = window.innerWidth / 2 + 420; // ben oltre il bordo visibile
  SLOTS["-2"].x = -edge;
  SLOTS["2"].x = edge;
}
computeSlots();

const slotsEl = document.getElementById("slots");

const cardEls = DESIGNS.map((d, i) => {
  const el = document.createElement("div");
  el.className = "slot-card";
  const img = document.createElement("img");
  img.src = d.image;
  img.alt = d.name;
  el.appendChild(img);
  slotsEl.appendChild(el);
  return el;
});

function wrap(i) { return ((i % N) + N) % N; }

function render() {
  DESIGNS.forEach((d, i) => {
    // distanza circolare più breve dall'indice corrente, tra -2 e +2
    let rel = i - currentIndex;
    rel = ((rel + N/2 + N) % N) - N/2;
    rel = Math.max(-2, Math.min(2, Math.round(rel)));

    const s = SLOTS[String(rel)];
    const el = cardEls[i];
    el.style.transform = `translate(-50%,-50%) translateX(${s.x}px) scale(${s.scale})`;
    el.style.opacity = s.opacity;
    el.style.zIndex = 10 - Math.abs(rel);
    el.classList.toggle("is-center", rel === 0);
  });
}
render();

function step(dir) {
  if (isAnimating) return;
  isAnimating = true;
  currentIndex = wrap(currentIndex + dir);
  render();
  setTimeout(() => { isAnimating = false; }, ANIM_MS);
}

/* ---------------- INTERAZIONE: solo lo scroll muove i design ---------------- */
let wheelAccum = 0;
const WHEEL_THRESHOLD = 45; // quanto scroll serve per far scattare una posizione

window.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (isAnimating) return;
  wheelAccum += e.deltaY + e.deltaX;
  if (Math.abs(wheelAccum) > WHEEL_THRESHOLD) {
    step(wheelAccum > 0 ? 1 : -1);
    wheelAccum = 0;
  }
}, { passive:false });

// swipe touch (mobile): stesso meccanismo a scatti
let touchStartX = null;
window.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; }, { passive:true });
window.addEventListener("touchend", (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1);
  touchStartX = null;
}, { passive:true });

window.addEventListener("resize", () => { computeSlots(); render(); });

/* piccola parallasse della maglietta al movimento del mouse, per un tocco vivo */
const shirtWrap = document.getElementById("shirtWrap");
window.addEventListener("pointermove", (e) => {
  const nx = (e.clientX / window.innerWidth - 0.5) * 2;
  const ny = (e.clientY / window.innerHeight - 0.5) * 2;
  shirtWrap.style.transform = `translate(${nx * 8}px, ${ny * 6}px) rotate(${nx * 1.2}deg)`;
});

document.getElementById("loading").style.opacity = "0";
setTimeout(() => document.getElementById("loading").style.display = "none", 400);
</script>
</body>
</html>
